name: 레일 갱신 & 배포

on:
  push:
    branches: [main]
  schedule:
    # 평일 한국 시간 09:25~16:25 매시 + 18:25 (UTC 기준으로 적음)
    # 야후 데이터가 15~20분 늦게 들어오므로 25분에 받으면 정각 무렵까지 담깁니다.
    - cron: '25 0-7,9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # 예약 실행이 꺼지지 않게 워크플로를 다시 켜 두는 데 씁니다

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 테스트
        run: npm test

      - name: 코스피 데이터 받기
        run: node scripts/fetch-kospi.mjs
        # 정기 실행에서 실패하면 배포를 건너뛰어 지금 떠 있는 레일을 유지합니다.
        # 코드를 올렸을 때(push)는 저장소에 있는 데이터로라도 배포합니다.
        continue-on-error: ${{ github.event_name != 'schedule' }}

      - name: 새 버전의 게임 파일 사용
        run: node scripts/version-assets.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      # 방금 올린 파일을 GitHub이 잠깐 못 찾아 배포가 실패하는 일이 있어, 30초 뒤 한 번 더 시도합니다.
      - name: 배포 재시도 전 대기
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

      # GitHub은 저장소에 60일 동안 변화가 없으면 예약 실행을 끕니다.
      # 예약 실행 때마다 워크플로를 '켜짐'으로 다시 표시해 두면 그 기한이 새로 시작됩니다.
      - name: 예약 실행 유지
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
